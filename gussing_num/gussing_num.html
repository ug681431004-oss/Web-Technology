<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Guessing Number Game</title>
	<style>
		body { font-family: Arial, sans-serif; text-align: center; margin: 60px auto; max-width: 500px; }
		input, button { font-size: 1rem; padding: 10px; margin: 5px; }
		#message { min-height: 25px; font-weight: bold; }
	</style>
</head>
<body>
	<h1>Guessing Number Game</h1>
	<p>Guess a number between 0 and 10.</p>
	<input id="guess" type="number" min="0" max="10" placeholder="Your guess">
	<button id="check">Check Guess</button>
	<p id="message"></p>
	<button id="playAgain" hidden>Play Again</button>
	<button id="quit" hidden>Quit</button>

	<script>
		let secretNumber;
		const guessInput = document.getElementById('guess');
		const checkButton = document.getElementById('check');
		const message = document.getElementById('message');
		const playAgainButton = document.getElementById('playAgain');
		const quitButton = document.getElementById('quit');

		function startGame() {
			secretNumber = Math.floor(Math.random() * 11);
			guessInput.value = '';
			guessInput.disabled = false;
			checkButton.hidden = false;
			playAgainButton.hidden = true;
			quitButton.hidden = true;
			message.textContent = '';
			guessInput.focus();
		}

		function checkGuess() {
			const guess = Number(guessInput.value);
			if (guessInput.value === '' || guess < 0 || guess > 10) {
				message.textContent = 'Please enter a number from 0 to 10.';
				return;
			}
			if (guess === secretNumber) {
				message.textContent = 'Yeah, you guessed it!';
				endRound();
			} else if (guess < secretNumber) {
				message.textContent = 'Too low, try again.';
			} else {
				message.textContent = 'Too high, try again.';
			}
		}

		function endRound() {
			guessInput.disabled = true;
			checkButton.hidden = true;
			playAgainButton.hidden = false;
			quitButton.hidden = false;
		}

		checkButton.addEventListener('click', checkGuess);
		guessInput.addEventListener('keydown', event => {
			if (event.key === 'Enter') checkGuess();
		});
		playAgainButton.addEventListener('click', startGame);
		quitButton.addEventListener('click', () => {
			message.textContent = 'Thanks for playing!';
			endRound();
			playAgainButton.hidden = true;
			quitButton.hidden = true;
		});

		startGame();
	</script>
</body>
</html>
